<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Integrity · Yarrr! (a gun on a shore)</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        -webkit-text-size-adjust: 100%;
      }
      #gpu-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #stats {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(6, 10, 18, 0.72);
        border: 1px solid rgba(120, 150, 200, 0.25);
        font-size: 12px;
        line-height: 1.6;
        color: #c7d6ef;
        pointer-events: none;
      }
      #stats b {
        color: #eaf2ff;
      }
      #status {
        position: fixed;
        inset: 0;
        /* A full-viewport overlay: it must never eat pointer input meant for the canvas
           (it sits over the whole scene whenever any message is showing). */
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        color: #dfe8f5;
        font-size: 16px;
        line-height: 1.7;
      }
      #status.err {
        color: #ffd7d7;
        background: #1a0d10;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <!-- ★ THE SAME EARTH. Not a copy of it.
       This page loads `/worlds/earth/world.json` — the identical world `terra.html` loads, which in
       turn names the identical body `assets/bodies/earth.json`. A first version of this scene copied
       that world file, which would have been a SECOND Earth free to drift from the first: precisely
       what docs/63 exists to end ("the Earth should be the Earth, no matter how close or how far the
       camera pans"). A scene is not a world. It is what is PLACED in one and where you stand to watch.

       So the only thing this page adds is `data-cannon` — a 24-pounder at a coordinate, facing a
       bearing, at an elevation. The camera follows from the gun rather than being stated separately:
       there is one fact here, not two that can disagree.

       FOUR shores, and the scene opens on whichever one the sun is up over. All four were found the
       same way — by scanning the shipped land mask for a headland with open water inside the gun's
       actual reach — so none is a chosen viewpoint; each is a shore that satisfies the shot. Galway
       Bay on the west coast of Ireland; the Pacific coast of Patagonia, which the ballistics search
       returned first; Mumbai, firing south-west into the Arabian Sea; and Sydney Harbour, firing east
       into the Tasman.

       ★ Why more than one: this scene runs on the REAL clock. Nothing pins the sun, so the light is
       whatever the light is, and Robin arrived to find the gun standing in the dark — *"It's dark in
       Galway… let's switch back to Chile. Probably need a scene button where you can flip to wherever
       it's daylight of the two."*

       ★★ Why FOUR and not two, and this was MEASURED rather than guessed. Ireland and Chile are only
       65 degrees of longitude apart, so there is a stretch of every day when BOTH are in the dark:
       **7.6 hours, worst case the sunnier of the two sitting 57 degrees BELOW its horizon.** Robin
       proposed Mumbai to widen it (*"so we can be sure no matter when we test we can get day or night
       as needed"*), which cuts that to 2.1 hours. Sydney closes it outright: across all four the worst
       case any hour of the day is the sun **23 degrees ABOVE** the horizon, and there is no hour when
       every shore is dark. `one_of_the_scenes_shores_is_always_in_daylight` sweeps a whole day through
       the engine's own solar direction and fails if that ever stops being true, so the button's
       promise is checked rather than hoped for.

       The page does not work out which shore is lit: it asks the engine (`Terra::sun_elevation_deg`),
       because solar geometry belongs to the engine and a page doing its own spherical trig would be a
       second answer to a question already answered. The button only moves where you STAND — it does
       not touch the sun.

       `the_yarr_scenes_gun_puts_its_shot_in_the_sea` reads this very attribute and fires EVERY site
       through the engine, so the claim in this comment is checked rather than asserted. -->
  <body
    data-world="/worlds/earth/world.json"
    data-cannon="Ireland@53.10,-9.45,200,20;Chile@-51.0,-75.0,250,20;Mumbai@19.05,72.80,220,20;Sydney@-33.80,151.30,80,20"
  >
    <canvas id="gpu-canvas"></canvas>
    <div id="stats" hidden></div>
    <div id="status">Loading world…</div>
    <script type="module" src="/src/terra.ts"></script>
  </body>
</html>
