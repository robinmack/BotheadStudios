name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Stock rustfmt defaults — there is no rustfmt.toml, deliberately (see CLAUDE.md rule 2). This job
      # exists so the tree cannot drift back out of conformance, which is what made the first sweep cost
      # 47 files. It is the cheapest job here, so it is first.
      - name: cargo fmt --check
        working-directory: integrity-engine
        run: cargo fmt --manifest-path crates/engine/Cargo.toml --all -- --check

  modapp:
    name: mod app (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrity-engine
      # The scene structs (Terra, OrbitDemo, Ground) are behind #[cfg(target_arch = "wasm32")], so a
      # native check is GREEN for code that does not build. The `wasm production build` job below does
      # catch it, but only after wasm-pack + npm ci + a full Vite build; this type-checks the same code
      # in a fraction of the time, so a broken scene fails fast instead of last.
      - name: cargo check --target wasm32-unknown-unknown
        working-directory: integrity-engine
        run: cargo check --lib --target wasm32-unknown-unknown --manifest-path crates/engine/Cargo.toml

  tests:
    name: native suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrity-engine
      - name: run the deploy gate
        run: bash integrity-engine/scripts/test.sh

  wasm-build:
    name: wasm production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrity-engine
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrity-engine/web/package-lock.json
      - name: install web deps
        working-directory: integrity-engine/web
        run: npm ci
      - name: production build
        working-directory: integrity-engine/web
        run: npm run build
      - name: wasm size
        working-directory: integrity-engine/web
        run: |
          echo "engine_bg.wasm raw bytes:    $(stat -c%s src/wasm/engine_bg.wasm)"
          echo "engine_bg.wasm gzip-9 bytes: $(gzip -9 -c src/wasm/engine_bg.wasm | wc -c)"
